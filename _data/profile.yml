about:
  lead: I am Zhu Enze (朱恩泽), a second-year undergraduate student in the [School of Automation](https://automation.xjtu.edu.cn) at [Xi'an Jiaotong University](https://www.xjtu.edu.cn) (西安交通大学) and a member of the 2023 class of the [Young Gifted Program](https://bjb.xjtu.edu.cn/info/1071/1237.htm) (YGP, 少年班).
  summary: My work sits at the intersection of computer vision, intelligent systems, and software engineering, with a focus on turning research ideas into working systems. My interests span machine learning, video understanding, embedded systems, and full-stack application development.
  resume_summary: I am Zhu Enze, a 2025 undergraduate in Automation at Xi'an Jiaotong University and a member of the 2023 Young Gifted Program, interested in intelligent systems, machine learning, software engineering, and embedded development.
  resume_focus:
    - Intelligent systems
    - Machine learning
    - Software engineering
    - Embedded development
  focus_areas:
    - Computer vision
    - Machine learning & Deep learning
    - Embodied intelligence
    - High-performance computing
    - Software engineering
    - Embedded development
    - Full-stack applications

