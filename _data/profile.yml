about:
  lead: I am Zhu Enze (朱恩泽), a second-year undergraduate student in the School of Automation at Xi'an Jiaotong University (西安交通大学) and a member of the 2023 class of the Young Gifted Program (YGP, 少年班).
  summary: My work sits at the intersection of computer vision, intelligent systems, and software engineering, with a focus on turning research ideas into working systems. My interests span machine learning, video understanding, embedded systems, and full-stack application development.
  focus_areas:
    - Computer vision
    - Machine learning & Deep learning
    - Embodied intelligence
    - Software engineering
    - Embedded development
    - Full-stack applications

