main:
  - date: 2026-10-24
    title: Joined Prof. Gelin Fu's Group for HPC Research
    description: Started preliminary research on software prefetching at the CPU architecture level in Prof. Gelin Fu's group at the [Institute of Artificial Intelligence and Robotics](https://iair.xjtu.edu.cn/), focused on high-performance computing.

  - date: 2026-10-20
    title: Named Outstanding Student Cadre
    description: Recognized by Xi'an Jiaotong University as an outstanding student cadre at the university level.

  - date: 2026-10-12
    title: CoS-VRL Research Collaboration Started
    description: Began CoS-VRL with [Chengqi Shi](https://1scq.github.io/), applying step-level verifiable reinforcement learning to make video diffusion reasoning more accurate and cheaper to train.

  - date: 2026-10-08
    title: 2025-2026 University Scholarship Awarded
    description: Received the third-class university scholarship for the 2025-2026 academic year, ranking 23/185 (top 13%) in the major.

  - date: 2026-10-02
    title: AI-Assisted Surgery Project Begins
    description: Joined Prof. Jiayi Wu's project at the [Institute of Artificial Intelligence and Robotics](https://iair.xjtu.edu.cn/) on AI-assisted laparoscopic surgery.

  - date: 2026-09-20
    title: Joined XJTU RoboCup Vision Group
    description: Became a member of the Xi'an Jiaotong University RoboCup vision group and started preparing for the RoboCup 2027 competition.

  - date: 2026-09-10
    title: 'Released "Chuang" (窗) Desktop Application'
    description: Published [Chuang](https://github.com/lsqkk/Chuang), an open-source Linux desktop app that renders the real sky, weather, and windowsill shadows in real time.

  - date: 2026-08-15
    title: Silver Award at the 2026 Innovation Competition
    description: Our team received a university-level silver award in the industry track of the 2026 China International College Students' Innovation Competition for label-corrected cervical cytology image diagnosis.

  - date: 2026-05-01
    title: Honorable Mention in MCM 2026
    description: Our team received an Honorable Mention in the 2026 Mathematical Contest in Modeling.

  - date: 2026-04-20
