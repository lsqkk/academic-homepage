  - date: 2026-04-10
    title: Joined the RACDataset Video Project
    description: Started working with Prof. Wang Hang on the RACDataset fitness video project, covering 63 action categories and more than 20,000 videos.

  - date: 2025-12-12
    title: 2024-2025 University-Level Scholarship Awarded
    description: Received the university-level third-class scholarship from Xi'an Jiaotong University for the 2024-2025 academic year.

  - date: 2025-12-01
    title: National First Prize in CUPEC
